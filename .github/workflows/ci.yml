name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Nautilus Studio
        run: pip install -e '.[dev]'
      - name: Lint and format check
        run: make lint
      - name: Repository hygiene
        run: |
          if git ls-files generated todo.md | grep -q .; then
            echo "generated evidence or internal TODO files must not be tracked"
            exit 1
          fi
          if git grep -nE 'registry\.mthreads\.com|10\.20\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|\.musa[0-9]+-downloads'; then
            echo "private registry, host, or machine-local model path found"
            exit 1
          fi
      - name: Test
        run: pytest -q
      - name: Build creator UI
        working-directory: web
        run: |
          npm ci
          npm run format
          npm run build
          npm audit --audit-level=high
          npm sbom --sbom-format cyclonedx --sbom-type application > ../web-sbom.json
      - name: Upload web SBOM
        uses: actions/upload-artifact@v7
        with:
          name: web-sbom
          path: web-sbom.json

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.1.2' 'setuptools>=83' wheel pip-audit
          python -m pip install -e '.[dev]'
          pip-audit --strict --vulnerability-service osv
          pip-audit --format cyclonedx-json --output python-sbom.json
      - name: Upload Python SBOM
        uses: actions/upload-artifact@v7
        with:
          name: python-sbom
          path: python-sbom.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
